steps:
  - name: 'docker:29'
    id: start-arango
    entrypoint: 'ash'
    args:
      - '-c'
      - |
        docker run -d --network=cloudbuild -e ARANGO_ROOT_PASSWORD=$_TEST_DB_PASS --name=arangodb arangodb/arangodb:3.12.1
        # Bounded wait: 60 tries x 2s = 120s, then fail the build.
        for i in $(seq 1 60); do
          if wget -q -O /dev/null http://arangodb:8529/_admin/server/availability; then
            echo 'ArangoDB is ready'
            exit 0
          fi
          sleep 2
        done
        echo 'ArangoDB did not become ready within 120s' >&2
        docker logs arangodb >&2
        docker rm -f arangodb
        exit 1

  - name: 'docker:29'
    id: generate-image-name
    entrypoint: 'ash'
    dir: services/cvd-enrollment
    args:
      - '-c'
      - |
        echo 'northamerica-northeast1-docker.pkg.dev/track-compliance/tracker/services/cvd-enrollment:'"$(echo $BRANCH_NAME | sed 's/[^a-zA-Z0-9]/-/g')-$SHORT_SHA-$(date +%s)" > /workspace/imagename

  - name: 'docker:29'
    id: build-test-image
    dir: services/cvd-enrollment
    args: ['build', '--target=test', '-t', 'test-image', '.']

  - name: 'test-image'
    id: run-tests
    dir: services/cvd-enrollment
    entrypoint: 'python3'
    args: [ '-m', 'pytest', 'tests/', '-v']

  - name: 'test-image'
    id: run-integration-tests
    dir: services/cvd-enrollment
    entrypoint: 'python3'
    args: [ '-m', 'pytest', 'tests/', '-v', '-m', 'integration']
    env:
      - TEST_ARANGO_URL=http://arangodb:8529
      - TEST_ARANGO_USER=root
      - TEST_ARANGO_PASS=$_TEST_DB_PASS

  - name: 'docker:29'
    id: build-production-image
    entrypoint: 'ash'
    dir: services/cvd-enrollment
    args:
      - '-c'
      - |
        image=$(cat /workspace/imagename)
        docker build -t $image .

  - name: 'docker:29'
    id: push-enrollment-if-master
    entrypoint: 'ash'
    dir: services/cvd-enrollment
    args:
      - '-c'
      - |
        if [[ '$BRANCH_NAME' == 'master' ]]
        then
          image=$(cat /workspace/imagename)
          docker push $image
        else
          exit 0
        fi

substitutions:
  # Throwaway password for the build-local test database. Not a real credential.
  _TEST_DB_PASS: cloudbuild-throwaway
