steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-test-image
    dir: scanners/web-processor
    args: ["build", "--target=test", "-t", "test-image", "."]

  - name: "test-image"
    id: test-results
    dir: /web-processor
    entrypoint: python3
    args: ["-m", "pytest", "-v"]

  - name: "gcr.io/cloud-builders/docker"
    id: generate-image-name
    entrypoint: "bash"
    dir: scanners/web-processor
    args:
      - "-c"
      - |
        echo "northamerica-northeast1-docker.pkg.dev/track-compliance/tracker/web-processor:$(echo $BRANCH_NAME | sed 's/[^a-zA-Z0-9]/-/g')-$SHORT_SHA-$(date +%s)" > /workspace/imagename

  - name: "gcr.io/cloud-builders/docker"
    id: build-https
    entrypoint: "bash"
    dir: scanners/web-processor
    args:
      - "-c"
      - |
        image=$(cat /workspace/imagename)
        docker build -t $image .

  - name: "gcr.io/cloud-builders/docker"
    id: push-https-if-master
    entrypoint: "bash"
    dir: scanners/web-processor
    args:
      - "-c"
      - |
        if [[ "$BRANCH_NAME" == "master" ]]
        then
          image=$(cat /workspace/imagename)
          docker push $image
        else
          exit 0
        fi
