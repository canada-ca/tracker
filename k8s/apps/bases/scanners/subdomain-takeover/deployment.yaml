apiVersion: apps/v1
kind: Deployment
metadata:
  name: subdomain-takeover
  labels:
    app: subdomain-takeover
  namespace: scanners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subdomain-takeover
  strategy: {}
  template:
    metadata:
      labels:
        app: subdomain-takeover
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subdomain-takeover
          image: northamerica-northeast1-docker.pkg.dev/track-compliance/tracker/subdomain-takeover:master-0000000-0 # {"$imagepolicy": "flux-system:subdomain-takeover"}
          env:
            - name: LOG_LEVEL
              value: info
            - name: NATS_URL
              value: nats://nats.pubsub:4222
            - name: NATS_STREAM
              value: SCANS
            - name: SUBJECT_IN
              value: scans.subdomain_takeover_requests
            - name: SUBJECT_OUT
              value: scans.findings.subdomain-takeover
            - name: DURABLE_NAME
              value: subdomain_takeover
            - name: WORKER_COUNT
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsGroup: 101
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          imagePullPolicy: Always
status: {}
