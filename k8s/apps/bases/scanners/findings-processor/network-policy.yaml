apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: findings-processor-netpol
  namespace: scanners
spec:
  podSelector:
    matchLabels:
      app: findings-processor
  policyTypes:
    - Ingress
    - Egress
  # no ingress rules: service accepts no inbound traffic
  ingress: []
  egress:
    # NATS JetStream
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pubsub
      ports:
        - protocol: TCP
          port: 4222
    # ArangoDB
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
          podSelector:
            matchLabels:
              app: arangodb
      ports:
        - protocol: TCP
          port: 8529
    # DNS queries
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
